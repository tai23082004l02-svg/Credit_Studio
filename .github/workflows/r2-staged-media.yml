name: Verify staged video media on R2
on:
  workflow_dispatch:
    inputs:
      map_blob:
        description: SHA of the temporary media-map Git blob (no media commits)
        required: true
        type: string
permissions:
  contents: read
jobs:
  upload-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      MAP_BLOB: ${{ inputs.map_blob }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL || vars.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'credit-studio' }}
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble mapped blobs, upload and verify SHA-256
        run: python3 tools/publish-staged-media.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-video-media
          path: work/release-media/verified.json
          retention-days: 30
