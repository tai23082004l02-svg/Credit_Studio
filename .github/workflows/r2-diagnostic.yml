name: Diagnose R2 access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check R2 credentials and read access
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL || vars.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'credit-studio' }}
        run: python3 tools/r2-diagnostic.py
