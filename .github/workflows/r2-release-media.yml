name: Verify staged video media on R2
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release containing the original media and hash map
        required: true
        type: string
      map_file:
        description: JSON map asset filename
        required: true
        type: string
permissions:
  # Reading draft release assets requires push access; this job never writes Git.
  contents: write
jobs:
  upload-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      MAP_FILE: ${{ inputs.map_file }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL || vars.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'credit-studio' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download only mapped release assets, upload and verify SHA-256
        run: python3 tools/publish-release-media.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-video-media
          path: work/release-media/verified.json
          retention-days: 30
